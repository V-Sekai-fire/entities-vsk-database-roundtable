name: sqlite-fdb-vfs-direct-workloadf
on:
  push:
concurrency:
  group: sqlite-fdb-vfs-direct-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sqlite-fdb-vfs-direct-workloadf:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      STORE_VERSION: 8045d4e2889a0e47a8fa5e6cca06c004a8ac36e7
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FoundationDB server and client
        run: |
          curl -LO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-server_7.3.63-1_amd64.deb
          curl -LO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.3.63-1_amd64.deb
          sudo dpkg -i foundationdb-server_7.3.63-1_amd64.deb

      - name: Wait for FoundationDB to be ready
        run: |
          sudo systemctl restart foundationdb
          for i in $(seq 1 30); do
            if fdbcli --exec "status minimal" --timeout 5 2>/dev/null | grep -q "available"; then
              echo "FoundationDB is available"
              break
            fi
            echo "waiting for FoundationDB ($i/30)"
            sleep 2
          done
          fdbcli --exec "status" --timeout 10

      - name: One FoundationDB process per core, on the memory engine
        run: |
          # The package starts one fdbserver. A cluster of one process has one
          # commit proxy, one resolver and one log, so every worker's commit
          # queues behind the others. One process per core lets FoundationDB
          # spread its roles. The memory engine keeps the data in RAM and logs
          # to disk, which is what a single-runner benchmark can afford; the
          # earlier redwood conversion also cost up to five minutes of setup.
          conf=/etc/foundationdb/foundationdb.conf
          for port in $(seq 4501 $((4500 + $(nproc) - 1))); do
            printf '\n[fdbserver.%s]\n' "$port" | sudo tee -a "$conf" >/dev/null
          done
          sudo sed -i '/^\[fdbserver\]/a storage_memory = 4GiB' "$conf"
          sudo systemctl restart foundationdb
          fdbcli --exec "configure memory" --timeout 30
          for i in $(seq 1 60); do
            if fdbcli --exec "status" --timeout 10 2>/dev/null | grep -q "Replication health  *- Healthy"; then
              break
            fi
            sleep 2
          done
          fdbcli --exec "status" --timeout 10

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsqlite3-dev python3

      - name: Checkout V-Sekai-fire/datasource-store (Rung 11, direct-linked)
        uses: actions/checkout@v4
        with:
          repository: V-Sekai-fire/datasource-store
          # A tag or a commit, never a branch tip: every other round pins its
          # subject (postgres:18, cockroach-v22.1.21, duckdb_jdbc-0.10.0,
          # foundationdb 7.3.63), and a moving ref here would mean this
          # column silently measured something different run to run.
          # Bump this deliberately when there is a new state to measure.
          ref: ${{ env.STORE_VERSION }}
          path: datasource-store

      - name: Build the store's ycsb_direct binary
        working-directory: datasource-store
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          cmake --build build --target ycsb_direct -j
          ls -la build/ycsb_direct

      - name: Run YCSB workload F
        env:
          WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
        working-directory: datasource-store
        run: |
          # ycsb_direct is a direct-linked native driver: each worker opens
          # sqlite3* against the FDB VFS in-process, on a database of its own.
          # One worker per core, and the records and operations divided among
          # them, so the totals are the other rounds' 100000 records and
          # 100000 operations, 50% READ + 50% RMW. Group commit of 1000.
          #
          # --sorted-load inserts the keys in the order the B-tree sorts
          # them, so the load appends pages instead of rewriting them.
          # --nomutex opens each worker's connection without SQLite's
          # per-connection mutex, since no connection is shared, and drops
          # the global memory statistics.
          #
          # [RUN] is the number to compare: the timed run alone, as YCSB's
          # own `run` step reports it. [OVERALL] adds the load and the close,
          # where the store folds its log into a shard.
          #
          # A player process commits one row at a time beside each round, and
          # reports its waits by the round's phase. Two settings alternate:
          # folds at FoundationDB's batch priority (the store's default) and
          # at default priority (WEFT_BULK_PRIORITY=default, the control).
          set -o pipefail
          workers=$(nproc)
          round() {
            fdbcli --exec "writemode on; clearrange weft/db/ycsb weft/db/ycsc" --timeout 30 >/dev/null
            rm -f /tmp/done /tmp/phases
            ./build/ycsb_direct 0 0 1 1 --player /tmp/done --phases /tmp/phases --nomutex \
              > /tmp/player.out 2>&1 &
            player=$!
            sleep 1
            timeout 300 ./build/ycsb_direct $((100000 / workers)) $((100000 / workers)) \
              "$workers" 1000 --sorted-load --nomutex --phases /tmp/phases
            touch /tmp/done
            wait $player
            cat /tmp/player.out
          }
          for i in 1 2 3; do
            echo "=== round $i: folds at batch priority"
            round
            echo "=== round $i: folds at default priority (control)"
            WEFT_BULK_PRIORITY=default round
          done 2>&1 | tee /tmp/ycsb-direct.log

      - name: Report FoundationDB status on failure
        if: failure()
        run: fdbcli --exec "status details" --timeout 10 || true

      - name: Report throughput
        if: always()
        run: |
          echo '## sqlite-fdb-vfs-direct workload F' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo "datasource-store $STORE_VERSION ($(git -C datasource-store rev-parse --short HEAD 2>/dev/null || echo unknown))" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # A timed-out or crashed workload leaves the log empty or absent,
          # and this step runs anyway so that shows up in the summary.
          cat /tmp/ycsb-direct.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ycsb-direct-log
          path: /tmp/ycsb-direct.log
