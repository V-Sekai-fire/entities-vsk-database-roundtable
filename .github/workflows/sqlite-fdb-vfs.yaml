name: sqlite-fdb-vfs-workloadf
on:
  push:
concurrency:
  group: sqlite-fdb-vfs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite-fdb-vfs-workloadf:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Python 2
        run: |
          sudo apt-get update
          sudo apt-get install -y python2

      - name: Install FoundationDB server and client
        run: |
          curl -LO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-server_7.3.63-1_amd64.deb
          curl -LO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.3.63-1_amd64.deb
          sudo dpkg -i foundationdb-server_7.3.63-1_amd64.deb

      - name: Wait for FoundationDB to be ready
        run: |
          sudo systemctl restart foundationdb
          for i in $(seq 1 30); do
            if fdbcli --exec "status minimal" --timeout 5 2>/dev/null | grep -q "available"; then
              echo "FoundationDB is available"
              break
            fi
            echo "waiting for FoundationDB ($i/30)"
            sleep 2
          done
          fdbcli --exec "status" --timeout 10

      - name: Install build toolchain
        run: |
          sudo apt-get install -y build-essential unzip

      - name: Checkout V-Sekai-fire/sqlite-jdbc (fdb_vfs merged into master)
        uses: actions/checkout@v4
        with:
          repository: V-Sekai-fire/sqlite-jdbc
          ref: master
          path: sqlite-jdbc-src

      - name: Build sqlite-jdbc with the FoundationDB VFS statically compiled in
        env:
          WEFT_BUILD_FDB_VFS: "1"
          FDB_CLIENT_INCLUDE: /usr/include/foundationdb
        run: |
          cd sqlite-jdbc-src
          make native
          # Assemble a runnable jar without maven. Excludes module-info.java
          # (requires slf4j and org.graalvm.nativeimage modules that neither
          # this classpath nor the runtime carry) and the GraalVM native-image
          # feature source (RuntimeJNIAccess et al. are only on the
          # graal-sdk classpath). Neither is needed by YCSB's jdbc binding.
          mkdir -p /tmp/sjdbc
          find src/main -name '*.java' \
            ! -name module-info.java \
            ! -path '*graalvm*' \
            ! -name 'SqliteJdbcFeature.java' > /tmp/sources.txt
          javac -cp target/classpath/slf4j-api.jar -d /tmp/sjdbc @/tmp/sources.txt
          cp -r src/main/resources/* /tmp/sjdbc/
          (cd /tmp/sjdbc && jar cf /tmp/sqlite-jdbc-fdbvfs.jar .)
          ls -lh /tmp/sqlite-jdbc-fdbvfs.jar
          # Confirm the fdb VFS zName made it into the .so (fdb_vfs.c
          # compiled into the amalgamation) and libfdb_c is linked.
          strings /tmp/sjdbc/org/sqlite/native/Linux/x86_64/libsqlitejdbc.so | grep -qx weft_fdb
          ldd /tmp/sjdbc/org/sqlite/native/Linux/x86_64/libsqlitejdbc.so | grep -q libfdb_c
          # slf4j-nop suppresses the SLF4J LoggerFactory startup crash for
          # sqlite-jdbc versions that hard-depend on the SPI.
          curl -sLo /tmp/slf4j-api.jar https://repo1.maven.org/maven2/org/slf4j/slf4j-api/1.7.36/slf4j-api-1.7.36.jar
          curl -sLo /tmp/slf4j-nop.jar https://repo1.maven.org/maven2/org/slf4j/slf4j-nop/1.7.36/slf4j-nop-1.7.36.jar

      - name: Download YCSB
        run: |
          wget https://github.com/brianfrankcooper/YCSB/releases/download/0.17.0/ycsb-0.17.0.tar.gz
          tar xfvz ycsb-0.17.0.tar.gz
          sed -i '1s|.*|#!/usr/bin/env python2|' ycsb-0.17.0/bin/ycsb
          cp /tmp/sqlite-jdbc-fdbvfs.jar ycsb-0.17.0/lib/
          cp /tmp/slf4j-api.jar /tmp/slf4j-nop.jar ycsb-0.17.0/lib/

      - name: Create workload F configuration
        run: |
          # 5000 rows / 5000 ops instead of the 100k the JDBC-in-memory rounds
          # use: SQLite-through-FDB-VFS runs at ~66 ops/sec (each op is one
          # sqlite page write plus one FDB commit RTT), so 100k ops would
          # take ~50 min on a CI runner. YCSB reports throughput per second,
          # not total time, so the per-second numbers stay comparable to the
          # other rounds; only the wall-clock is shorter here.
          mkdir -p workloads
          cat > ./workloads/workloadf <<EOL
          workload=site.ycsb.workloads.CoreWorkload
          readallfields=true
          readproportion=0.5
          updateproportion=0
          scanproportion=0
          insertproportion=0
          readmodifywriteproportion=0.5
          requestdistribution=zipfian
          recordcount=5000
          operationcount=5000
          fieldcount=3
          fieldlength=100
          EOL

      - name: Create the usertable through the FDB-backed VFS
        env:
          WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
        run: |
          # journal_mode=memory keeps SQLite from writing (and fsyncing) its
          # own rollback journal file. Durability still holds because every
          # SQLite commit calls xSync on the VFS, which fdb_vfs.c turns into
          # an FDB commit -- and the FDB transaction log is fsynced by the
          # cluster before the commit returns. Without this pragma SQLite
          # pays a journal fsync (through the FDB VFS, another FDB commit)
          # plus the data fsync on every YCSB op, halving throughput.
          cat > /tmp/CreateTable.java <<'EOF'
          import java.sql.*;
          public class CreateTable {
            public static void main(String[] a) throws Exception {
              Class.forName("org.sqlite.JDBC");
              try (Connection c = DriverManager.getConnection(
                     "jdbc:sqlite:file:/tmp/ycsb.db?vfs=weft_fdb");
                   Statement s = c.createStatement()) {
                s.execute("PRAGMA journal_mode=MEMORY");
                s.execute("CREATE TABLE IF NOT EXISTS usertable ("
                        + " ycsb_key VARCHAR(255) PRIMARY KEY,"
                        + " field0 TEXT, field1 TEXT, field2 TEXT)");
                System.out.println("usertable ready, journal_mode=MEMORY");
              }
            }
          }
          EOF
          javac -cp /tmp/sqlite-jdbc-fdbvfs.jar:/tmp/slf4j-api.jar:/tmp/slf4j-nop.jar \
            -d /tmp /tmp/CreateTable.java
          java -cp /tmp:/tmp/sqlite-jdbc-fdbvfs.jar:/tmp/slf4j-api.jar:/tmp/slf4j-nop.jar CreateTable

      # journal_mode=memory is NOT stored in the SQLite file header (only
      # DELETE / WAL / TRUNCATE / PERSIST are), so YCSB's own connections
      # would revert to the default journal without it. Passing the pragma
      # as a URL parameter makes sqlite-jdbc set it on each new connection.
      # This removes the SQLite journal fsync layer (which itself was going
      # through fdb_vfs.c as a second FDB commit per YCSB op); the FDB
      # transaction-log fsync remains as the sole durable barrier.
      - name: Load initial data
        env:
          WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
        run: |
          cd ycsb-0.17.0
          ./bin/ycsb load jdbc -s -P ../workloads/workloadf \
            -p db.driver=org.sqlite.JDBC \
            -p db.url='jdbc:sqlite:file:/tmp/ycsb.db?vfs=weft_fdb&journal_mode=MEMORY' \
            -p jdbc.autocommit=true \
            -p db.batchsize=1000

      - name: Run Workload F
        env:
          WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
        run: |
          cd ycsb-0.17.0
          ./bin/ycsb run jdbc -s -P ../workloads/workloadf \
            -p db.driver=org.sqlite.JDBC \
            -p db.url='jdbc:sqlite:file:/tmp/ycsb.db?vfs=weft_fdb&journal_mode=MEMORY' \
            -p jdbc.autocommit=true \
            -p db.batchsize=1000 > ../sqlite_fdb_vfs_results_workloadf.txt

      - name: Upload SQLite-FDB-VFS results
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-fdb-vfs-results-workloadf
          path: sqlite_fdb_vfs_results_workloadf.txt
